<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #f7f6f3;
    --panel: #ffffff;
    --sunk: #efeee9;
    --line: #e0dfd9;
    --rule: #eceae4;
    --ink: #17181c;
    --dim: #6b6d75;
    --faint: #9a9ca3;
    --ghost: #c3c4c9;
    --accent: #3b53b8;
    --accent-soft: #e6eaf9;
    --added: #2f7d4f;
    --added-soft: rgba(47, 125, 79, 0.11);
    --removed: #b04630;
    --removed-soft: rgba(176, 70, 48, 0.11);
    --iface: #9a6a17;
    --iface-soft: #fbf2e0;
    --iface-line: #e2cb9a;
    --body: #8a8c94;
    --mark: #eceae4;
    /* The diff is gruvbox, in otis's colours for it: delta's grounds for a
       changed line and a changed word, and gruvbox's own for the syntax. */
    --code-bg: #fbf1c7; --code-fg: #3c3836; --code-gutter: #bdae93; --code-rule: #ebdbb2;
    --code-minus: #edcdaa; --code-plus: #e8deab; --code-minus-emph: #dda489; --code-plus-emph: #d1c98c;
    --code-del: #9d0006; --code-add: #79740e;
    --tk-kw: #9d0006; --tk-decl: #af3a03; --tk-str: #79740e; --tk-num: #8f3f71;
    --tk-com: #928374; --tk-type: #b57614; --tk-fn: #427b58; --tk-meta: #076678;
    --panel-w: 440px;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --ui: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --display: "Instrument Serif", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #101116; --panel: #15161c; --sunk: #12131a; --line: #24262e; --rule: #1c1e25;
      --ink: #e8e6e1; --dim: #8e9099; --faint: #6f727c; --ghost: #4c4f59;
      --accent: #8ba3f0; --accent-soft: #23294a;
      --added: #74c28d; --added-soft: rgba(116, 194, 141, 0.11);
      --removed: #e08b76; --removed-soft: rgba(224, 139, 118, 0.11);
      --iface: #d8a24a; --iface-soft: #1b1a17; --iface-line: #4a3a20;
      --body: #6f727c; --mark: #1f222b;
      --code-bg: #282828; --code-fg: #ebdbb2; --code-gutter: #665c54; --code-rule: #3c3836;
      --code-minus: #3c2022; --code-plus: #26332a; --code-minus-emph: #6b2f31; --code-plus-emph: #3f5a45;
      --code-del: #fb4934; --code-add: #b8bb26;
      --tk-kw: #fb4934; --tk-decl: #fe8019; --tk-str: #b8bb26; --tk-num: #d3869b;
      --tk-com: #928374; --tk-type: #fabd2f; --tk-fn: #8ec07c; --tk-meta: #83a598;
    }
  }
  :root[data-theme="dark"] {
    --ground: #101116; --panel: #15161c; --sunk: #12131a; --line: #24262e; --rule: #1c1e25;
    --ink: #e8e6e1; --dim: #8e9099; --faint: #6f727c; --ghost: #4c4f59;
    --accent: #8ba3f0; --accent-soft: #23294a;
    --added: #74c28d; --added-soft: rgba(116, 194, 141, 0.11);
    --removed: #e08b76; --removed-soft: rgba(224, 139, 118, 0.11);
    --iface: #d8a24a; --iface-soft: #1b1a17; --iface-line: #4a3a20;
    --body: #6f727c; --mark: #1f222b;
    --code-bg: #282828; --code-fg: #ebdbb2; --code-gutter: #665c54; --code-rule: #3c3836;
    --code-minus: #3c2022; --code-plus: #26332a; --code-minus-emph: #6b2f31; --code-plus-emph: #3f5a45;
    --code-del: #fb4934; --code-add: #b8bb26;
    --tk-kw: #fb4934; --tk-decl: #fe8019; --tk-str: #b8bb26; --tk-num: #d3869b;
    --tk-com: #928374; --tk-type: #fabd2f; --tk-fn: #8ec07c; --tk-meta: #83a598;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.5 var(--ui); -webkit-font-smoothing: antialiased; overflow: hidden;
    display: flex; flex-direction: column;
  }
  button, input { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------- top bar ----------
     Three groups and no more: what this is, which view, and what you can do
     to it. Everything that was a fourth group is either in the menu at the
     end or in the panel, where there was already room for it. */
  header {
    height: 52px; flex: none; display: flex; align-items: center; gap: 14px;
    padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: relative;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .wordmark { font-family: var(--display); font-size: 23px; line-height: 1; }
  .rev { font-family: var(--mono); font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .views { display: inline-flex; gap: 2px; padding: 2px; background: var(--ground); border: 1px solid var(--line); border-radius: 9px; margin: 0 auto; }
  .views button {
    font-size: 12px; font-weight: 500; height: 26px; padding: 0 13px;
    border: 0; border-radius: 7px; background: none; color: var(--dim); cursor: pointer;
  }
  .views button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .right { display: flex; align-items: center; gap: 8px; }
  .find { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; background: var(--ground); border: 1px solid var(--line); border-radius: 9px; width: 190px; transition: width .16s ease; }
  .find:focus-within { width: 250px; border-color: var(--accent); }
  .find input { border: 0; background: none; color: inherit; font-size: 12.5px; width: 100%; min-width: 0; }
  .find input::placeholder { color: var(--faint); }
  .find input:focus { outline: none; }
  /* The verdict is the one thing in here with an opinion, so it is the one
     thing allowed a colour. */
  .verdict {
    display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px;
    border-radius: 9px; border: 1px solid var(--line); background: var(--ground);
    font-size: 12.5px; color: var(--dim); cursor: pointer; white-space: nowrap;
  }
  .verdict i { width: 3px; height: 13px; border-radius: 2px; background: var(--added); }
  .verdict.look { background: var(--iface-soft); border-color: var(--iface-line); color: var(--iface); }
  .verdict.look i { background: var(--iface); }
  .verdict.bad { background: var(--removed-soft); border-color: var(--removed); color: var(--removed); }
  .verdict.bad i { background: var(--removed); }
  .ghostbtn {
    height: 30px; padding: 0 13px; font-size: 12.5px; border: 1px solid var(--line);
    border-radius: 9px; background: var(--panel); color: var(--dim); cursor: pointer;
  }
  .ghostbtn:hover { color: var(--ink); }
  .more { width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 9px; background: var(--ground); color: var(--dim); cursor: pointer; font-size: 15px; line-height: 1; }
  .more:hover, .more[aria-expanded="true"] { color: var(--ink); background: var(--mark); }
  .menu {
    position: absolute; top: 46px; right: 16px; z-index: 30; width: 268px; padding: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 34px rgba(0,0,0,.20);
  }
  .menu .mtitle { padding: 8px 10px 4px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .menu label { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; color: var(--ink); cursor: pointer; }
  .menu label:hover { background: var(--mark); }
  .menu .keyline { padding: 8px 10px 6px; margin-top: 4px; border-top: 1px solid var(--rule); font-size: 11.5px; color: var(--faint); line-height: 1.7; }
  .menu .keyline b { font-family: var(--mono); font-weight: 500; color: var(--dim); }
  /* Read progress, as a hairline along the foot of the bar: ambient, and no
     row of its own. */
  .tide { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--added); transition: width .2s ease; z-index: 1; }

  @media (max-width: 900px) { header .find { width: 130px; } header .find:focus-within { width: 170px; } }
  main { flex-grow: 1; display: flex; min-height: 0; }
  #stage { position: relative; flex-grow: 1; min-width: 0; background: var(--ground); overflow: hidden; }

  /* ---------- graph ---------- */
  .lanes { position: absolute; left: 0; right: 0; top: 0; height: 32px; z-index: 2; pointer-events: none; overflow: hidden; }
  .lanes span { position: absolute; top: 12px; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ghost); white-space: nowrap; transition: opacity .18s ease; }
  svg.map { position: absolute; left: 0; top: 32px; right: 0; bottom: 0; width: 100%; height: calc(100% - 32px); cursor: grab; touch-action: none; }
  svg.map.dragging { cursor: grabbing; }
  .frame { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; rx: 12; }
  .frame-label { font-family: var(--mono); font-size: 10px; fill: var(--faint); }
  .note-label { font-family: var(--ui); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; fill: var(--ghost); }
  .edge { fill: none; stroke: var(--ghost); stroke-width: 1.3; }
  .edge.iface { stroke: var(--iface); stroke-width: 1.7; }
  .edge.body { stroke-dasharray: 4 4; }
  .edge.back { stroke: var(--removed); stroke-dasharray: 5 3; }
  .edge.fade { opacity: .18; }
  .edge.lit { stroke-width: 2.4; }
  /* A box is a box. What kind of change it is lives in the glyph, which is one
     character wide; amber on the box itself is kept for the only thing that
     earns alarm — an interface something else names in its own signature, so
     the change does not stop there. A screen where every box is amber says
     nothing at all. */
  .node rect.box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; rx: 9; }
  .node.removed rect.box { stroke-dasharray: 5 3; }
  .node.carries rect.box { stroke: var(--iface-line); stroke-width: 1.6; }
  .node .glyph { font-family: var(--mono); font-size: 12px; font-weight: 500; }
  .node .label { font-family: var(--mono); font-size: 12.5px; fill: var(--ink); }
  .node .lines { font-family: var(--mono); font-size: 10.5px; fill: var(--faint); }
  .node .entry { fill: var(--accent); }
  .node.added .label { fill: var(--added); }
  .node.removed .label { fill: var(--removed); }
  .node { cursor: pointer; }
  .node.fade { opacity: .25; }
  .node.sel rect.box { stroke: var(--accent); stroke-width: 2.4; fill: var(--mark); }
  .carries rect { fill: var(--iface-soft); stroke: var(--iface-line); rx: 8; }
  .carries text { font-family: var(--ui); font-size: 9.5px; fill: var(--iface); }

  /* Chrome on the canvas waits to be wanted: it fades in when the pointer is
     over the stage and is not there at all when it would say nothing. */
  .overlay { position: absolute; display: flex; align-items: center; gap: 14px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-size: 11px; color: var(--dim); box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .overlay.shy { opacity: 0; transition: opacity .18s ease; pointer-events: none; }
  #stage:hover .overlay.shy, .overlay.shy:focus-within { opacity: 1; pointer-events: auto; }
  .zoom { right: 16px; bottom: 16px; padding: 4px; gap: 2px; }
  .zoom button { width: 27px; height: 27px; border: 0; border-radius: 7px; background: none; color: var(--dim); font-size: 13px; cursor: pointer; }
  .zoom button.wide { width: auto; padding: 0 10px; font-size: 11.5px; }
  .zoom button:hover { background: var(--mark); color: var(--ink); }
  #mini { position: absolute; right: 16px; bottom: 60px; width: 168px; height: 100px; padding: 6px; overflow: hidden; }
  #mini svg { display: block; width: 100%; height: 100%; }
  .mini-dot { fill: var(--ghost); }
  .mini-dot.hot { fill: var(--iface); }
  .mini-view { fill: none; stroke: var(--accent); stroke-width: 6; }

  /* ---------- reading ---------- */
  #reading { position: absolute; inset: 0; overflow: auto; padding: 26px 28px 60px; }
  /* A column, not the whole width of the window: a row of names 1500px wide
     is one your eye loses its place along. */
  #reading > * { max-width: 980px; margin-left: auto; margin-right: auto; }
  .head-line { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .head-line h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; }
  .head-line p { margin: 0; font-size: 12.5px; color: var(--dim); }
  .head-line .carry { flex-basis: 100%; }
  .thread { border: 1px solid var(--line); border-radius: 12px; background: var(--sunk); margin-bottom: 12px; overflow: hidden; }
  .thread > .top { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: var(--panel); cursor: pointer; }
  .thread.open > .top { border-bottom: 1px solid var(--rule); }
  .num { width: 22px; height: 22px; flex: none; border-radius: 6px; background: var(--mark); color: var(--dim); font-family: var(--mono); font-size: 11.5px; display: flex; align-items: center; justify-content: center; }
  .thread.open .num { background: var(--accent-soft); color: var(--accent); }
  .thread .name { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
  .thread .about { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--dim); white-space: nowrap; }
  .bar { width: 74px; height: 5px; border-radius: 3px; background: var(--mark); overflow: hidden; display: inline-block; }
  .bar i { display: block; height: 5px; background: var(--added); }
  .rows { padding: 6px 0 8px; }
  .r { display: flex; align-items: center; gap: 9px; padding: 6px 14px; position: relative; cursor: pointer; }
  .r:hover { background: var(--mark); }
  .r.sel { background: var(--mark); box-shadow: inset 3px 0 0 var(--accent); }
  .r .tick { width: 16px; height: 16px; flex: none; border-radius: 5px; border: 1px solid var(--line); background: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .r.read .tick { background: var(--added); border-color: var(--added); }
  .r.read .nm { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--ghost); }
  .r .g { font-family: var(--mono); font-size: 12.5px; width: 10px; text-align: center; }
  .r .nm { font-family: var(--mono); font-size: 13px; }
  .r .where { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .r .lines { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
  .pill { padding: 2px 7px; border-radius: 999px; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
  .pill.iface { background: var(--iface-soft); color: var(--iface); }
  .pill.bodyf { background: var(--mark); color: var(--faint); }
  .pill.new { background: var(--accent-soft); color: var(--accent); }
  .pill.carries { background: var(--iface-soft); color: var(--iface); text-transform: none; letter-spacing: 0; }
  .elbow { position: absolute; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); border-bottom-left-radius: 5px; width: 10px; pointer-events: none; }
  .r.added .g, .r.added .nm { color: var(--added); }
  .r.removed .g, .r.removed .nm { color: var(--removed); }
  .r.signature .g { color: var(--iface); }
  .r.body .g { color: var(--ghost); }
  .aside { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; font-size: 12px; color: var(--faint); }
  .aside i { height: 1px; flex-grow: 1; background: var(--rule); }
  .files { list-style: none; margin: 0; padding: 0 2px; font-family: var(--mono); font-size: 12px; color: var(--dim); columns: 2; column-gap: 28px; }
  .files li { padding: 2px 0; break-inside: avoid; }
  .files b { font-weight: 400; color: var(--faint); font-variant-numeric: tabular-nums; }

  /* ---------- panel ---------- */
  #panel { width: var(--panel-w); flex: none; min-width: 0; background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
  /* The handle between the two: a hairline that thickens under the pointer. */
  .grip { flex: none; width: 7px; cursor: col-resize; background: var(--line); position: relative; }
  .grip::after { content: ""; position: absolute; inset: 0 3px; background: var(--line); }
  .grip:hover::after, .grip.on::after { background: var(--accent); }
  .grip:hover, .grip.on { background: var(--accent-soft); }
  #panel .scroll { overflow: auto; flex-grow: 1; }
  .ptop { padding: 20px 20px 16px; border-bottom: 1px solid var(--rule); }
  .ptop h2 { margin: 0; font-family: var(--mono); font-size: 17px; font-weight: 500; word-break: break-all; }
  .ptop .path { margin-top: 5px; font-family: var(--mono); font-size: 11.5px; color: var(--dim); word-break: break-all; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); font-size: 11px; color: var(--dim); white-space: nowrap; }
  .chip.signature { color: var(--iface); background: var(--iface-soft); border-color: var(--iface-line); }
  .chip.added { color: var(--added); border-color: currentColor; }
  .chip.removed { color: var(--removed); border-color: currentColor; }
  .says { margin: 16px 20px 0; padding: 12px 14px; border-radius: 9px; background: var(--iface-soft); border-left: 3px solid var(--iface); font-size: 12.5px; line-height: 1.55; color: var(--iface); }
  .says.calm { background: var(--mark); border-left-color: var(--ghost); color: var(--dim); }
  .says code { font-family: var(--mono); }
  .sec { padding: 18px 20px 8px; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  /* The diff the way otis's delta draws one: both line numbers, the syntax
     coloured on every line, the words that changed on a darker ground than
     the line they are in, and long unchanged runs folded away. The gutter
     stays put while the code scrolls under it. */
  .diff { margin: 0 20px; border: 1px solid var(--line); border-radius: 9px; background: var(--code-bg); color: var(--code-fg); overflow: auto; max-height: 44vh; font-family: var(--mono); font-size: 12px; line-height: 1.6; padding: 4px 0; tab-size: 4; }
  .diff .rows { display: inline-block; min-width: 100%; }
  .dl { display: flex; white-space: pre; background: var(--code-bg); }
  .dl .gut { position: sticky; left: 0; flex: none; display: flex; background: inherit; border-right: 1px solid var(--code-rule); color: var(--code-gutter); font-variant-numeric: tabular-nums; }
  .dl .ln { width: 4.5ch; text-align: right; }
  .dl .ln + .ln { padding-right: 1ch; width: 5.5ch; }
  .dl .mk { width: 2.5ch; flex: none; text-align: center; color: var(--code-gutter); }
  .dl .tx { padding-right: 12px; }
  .dl.add { background: var(--code-plus); } .dl.add .mk { color: var(--code-add); }
  .dl.del { background: var(--code-minus); } .dl.del .mk { color: var(--code-del); }
  .dl.add .em { background: var(--code-plus-emph); border-radius: 2px; }
  .dl.del .em { background: var(--code-minus-emph); border-radius: 2px; }
  .dl.fold { cursor: pointer; color: var(--code-gutter); }
  .dl.fold:hover { color: var(--code-fg); }
  .dl.fold .tx { font-style: italic; }
  .tk-kw { color: var(--tk-kw); } .tk-decl { color: var(--tk-decl); } .tk-str { color: var(--tk-str); }
  .tk-num { color: var(--tk-num); } .tk-com { color: var(--tk-com); font-style: italic; } .tk-type { color: var(--tk-type); }
  .tk-fn { color: var(--tk-fn); } .tk-meta { color: var(--tk-meta); }
  /* ---------- mentions and the card ----------
     A mention of another changed definition is underlined in the colour of
     how that one changed: solid where the change made the mention, dotted
     where it was there already. */
  .ref { text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: pointer; border-radius: 2px; }
  .ref.new { text-decoration-style: solid; }
  .ref.signature { text-decoration-color: var(--tk-type); } .ref.added { text-decoration-color: var(--code-add); }
  .ref.removed { text-decoration-color: var(--code-del); } .ref.body { text-decoration-color: var(--code-gutter); }
  .ref:hover, .ref:focus-visible { background: var(--code-rule); outline: none; }
  .pop {
    position: fixed; z-index: 50; width: 360px; max-width: calc(100vw - 24px); padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
    box-shadow: 0 14px 38px rgba(0,0,0,.22); font-size: 12.5px; line-height: 1.5;
    animation: pop-in .12s ease-out;
  }
  @keyframes pop-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .pop-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pop-top .g { font-family: var(--mono); width: 10px; text-align: center; flex: none; }
  .pop-top .nm { font-family: var(--mono); font-size: 13px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pop-top .chip { margin-left: auto; flex: none; }
  .pop-path { margin: 3px 0 0 18px; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .pop-sig { margin: 10px 0 2px; padding: 7px 10px; border-radius: 7px; background: var(--code-bg); color: var(--code-fg); font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; word-break: break-word; }
  .pop p { margin: 8px 0 0; }
  .pop-where { color: var(--dim); }
  .pop-where b { font-weight: 500; color: var(--ink); } .pop-where b.iface { color: var(--iface); }
  .pop-foot { margin-top: 10px; font-size: 11px; color: var(--faint); }

  /* ---------- Claude's notes ----------
     Model-written, so they look it: marked with a spark, in the accent, and
     never in the voice of the facts seam worked out itself. */
  .quip { color: var(--dim); }
  .quip.does { margin: 12px 0 0; color: var(--ink); font-size: 13px; line-height: 1.5; }
  .quip.does::before, .quip.spine::before, .pop .quip.does::before { content: "\2726  "; color: var(--accent); font-size: 11px; }
  .quip.gloss, .quip.edge, .quip.rowq { font-style: italic; color: var(--accent); }
  .quip.why { margin: 6px 0 0; font-size: 12px; color: var(--dim); }
  .sec .quip.gloss { margin-left: 10px; font-size: 12px; letter-spacing: 0; text-transform: none; }
  .quip.edge { margin: -2px 0 4px 35px; font-size: 11.5px; }
  .quip.rowq { font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; }
  .quip.spine { margin: 16px 0 0; font-size: 14px; line-height: 1.55; color: var(--ink); }
  .quip.waiting { font-style: italic; color: var(--faint); background: linear-gradient(90deg, var(--faint) 0%, var(--ink) 50%, var(--faint) 100%) 0 0 / 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 1.6s linear infinite; }
  .quip.waiting::before { -webkit-text-fill-color: var(--accent); }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .quip.waiting, .pop { animation: none; } }
  .starts { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
  .starts button { display: flex; gap: 10px; align-items: baseline; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 8px; color: inherit; cursor: pointer; font-size: 12.5px; }
  .starts button:hover { background: var(--mark); }
  .starts .n { font-family: var(--mono); font-size: 11px; color: var(--accent); flex: none; width: 12px; }
  .starts .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .starts .nm { font-family: var(--mono); }
  .starts .quip { font-size: 12px; }
  .breaks rect { fill: var(--panel); stroke: var(--removed); rx: 8; }
  .breaks text { font-family: var(--ui); font-size: 9.5px; fill: var(--removed); }
  .sec .brk { margin-left: 8px; color: var(--removed); letter-spacing: .06em; }
  .uses button.broken .g, .uses button.broken .nm { color: var(--removed); }
  .carry-list .cnote { margin: -4px 0 6px 30px; }
  .cnote { margin: -2px 0 4px 35px; font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: pre-wrap; word-break: break-word; }
  .cnote.breaks { color: var(--removed); }
  .pop-where.breaks b { color: var(--removed); }
  .outside:empty { display: none; }
  .outside .far { font-family: var(--mono); text-transform: none; letter-spacing: 0; font-size: 11px; }
  .uses { padding: 0 12px; display: flex; flex-direction: column; gap: 1px; }
  .uses button { display: flex; align-items: center; gap: 9px; width: 100%; min-width: 0; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 7px; color: inherit; cursor: pointer; }
  .uses button:hover { background: var(--mark); }
  .uses .nm { font-family: var(--mono); font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .uses .g { font-family: var(--mono); font-size: 12px; width: 10px; flex: none; text-align: center; }
  .uses .far { margin-left: auto; flex: none; padding-left: 8px; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
  .uses .far.iface { color: var(--iface); }
  .pfoot { padding: 14px 20px; border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 10px; }
  .mark-read { flex-grow: 1; height: 38px; border: 0; border-radius: 8px; background: var(--added); color: var(--ground); font-size: 12.5px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .mark-read.done { background: var(--mark); color: var(--dim); }
  .kbd { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .empty { color: var(--faint); font-size: 12.5px; padding: 0 20px; margin: 0; }
  .hint { color: var(--dim); font-size: 12.5px; line-height: 1.6; padding: 20px; }
  .hint code { font-family: var(--mono); background: var(--mark); padding: 1px 5px; border-radius: 4px; }

  /* ---------- the panel with nothing selected ----------
     It is the widest thing on the screen, so it does not get to say "click a
     definition" and stop. With nothing chosen it is the change at a glance:
     what kind of change it is, and which definitions carry furthest. */
  .over { padding: 22px 20px 26px; }
  .over h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 25px; line-height: 1.15; }
  .over .sub { margin: 6px 0 0; font-size: 12.5px; color: var(--dim); }
  .counts { margin: 20px 0 0; display: flex; flex-direction: column; gap: 1px; }
  .counts .c { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; }
  .counts .c:hover { background: var(--mark); cursor: pointer; }
  .counts .c b { font-family: var(--mono); font-weight: 500; font-size: 13px; width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  .counts .c span { color: var(--dim); }
  .counts .c i { width: 7px; height: 7px; border-radius: 2px; flex: none; }
  .over .lead { margin: 22px 0 8px; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .carry-list { display: flex; flex-direction: column; gap: 1px; }
  .carry-list button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; color: inherit; cursor: pointer; min-width: 0; }
  .carry-list button:hover { background: var(--mark); }
  .carry-list .nm { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .carry-list .n { margin-left: auto; flex: none; font-size: 11px; color: var(--iface); white-space: nowrap; }
  .over .note { margin: 20px 0 0; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 12px; line-height: 1.65; color: var(--faint); }
  .over .note b { font-weight: 500; color: var(--dim); }

  /* ---------- score ---------- */
  .veil { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45); display: flex; align-items: center; justify-content: center; z-index: 20; }
  .sheet { width: min(960px, 92%); max-height: 88%; background: var(--sunk); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
  .sheet .top { padding: 24px 28px 20px; border-bottom: 1px solid var(--rule); display: flex; align-items: flex-start; gap: 20px; }
  .sheet h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 29px; line-height: 1.1; }
  .sheet .why { margin: 7px 0 0; font-size: 12.5px; color: var(--dim); max-width: 60ch; line-height: 1.6; }
  .sheet .totals { margin-left: auto; text-align: right; font-family: var(--mono); font-size: 12px; color: var(--faint); white-space: nowrap; }
  .sheet .body { overflow: auto; padding: 4px 28px 8px; }
  .m { display: flex; align-items: center; gap: 14px; padding: 12px 0 10px; border-top: 1px solid var(--rule); }
  .m.first { border-top: 0; }
  .m .flag { width: 4px; height: 28px; border-radius: 2px; flex: none; background: var(--added); }
  .m.look .flag { background: var(--iface); } .m.bad .flag { background: var(--removed); }
  .m .mname { width: 94px; flex: none; font-size: 13px; font-weight: 500; }
  .m .mval { width: 150px; flex: none; font-family: var(--mono); font-size: 12.5px; color: var(--dim); }
  .m.look .mval { color: var(--iface); } .m.bad .mval { color: var(--removed); }
  .m .scale { width: 150px; flex: none; height: 6px; border-radius: 3px; position: relative; }
  .m .scale i { position: absolute; top: -4px; width: 2px; height: 14px; border-radius: 1px; background: var(--ink); }
  .m .mnote { flex-grow: 1; font-size: 12.5px; color: var(--dim); }
  .advice { padding: 0 0 14px 112px; font-size: 12.5px; line-height: 1.6; color: var(--ink); opacity: .82; max-width: 78ch; }
  .sheet .foot { padding: 13px 28px; border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 16px; font-size: 11.5px; color: var(--faint); }
  .sheet .foot .keys { display: flex; gap: 12px; }
  .sheet .foot .keys span { display: inline-flex; align-items: center; gap: 6px; }
  .sheet .foot .keys i { width: 16px; height: 5px; border-radius: 3px; display: inline-block; }
  .sheet .close { margin-left: auto; }

  #drop { margin: 14vh auto; max-width: 54ch; padding: 34px; text-align: center; border: 1px dashed var(--line); border-radius: 14px; background: var(--panel); }
  #drop h2 { margin: 0 0 10px; font-family: var(--display); font-weight: 400; font-size: 24px; }
  @media (max-width: 900px) {
    main { flex-direction: column; }
    #panel { width: auto; border-top: 1px solid var(--line); max-height: 46%; }
    .grip { display: none; }
  }
</style>

<body>
<!--SEAM DATA-->
<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var el = document.getElementById("seam-data");
  var data = null;
  try { data = JSON.parse((el && el.textContent) || "null"); } catch (e) { data = null; }

  var GLYPH = { added: "+", removed: "−", signature: "~", body: "·" };
  var WORD = { added: "added", removed: "removed", signature: "interface changed", body: "body only" };
  var NH = 30, ROW = 44, GAP = 62, PAD = 26;
  var COLOUR = { added: "var(--added)", removed: "var(--removed)", signature: "var(--iface)", body: "var(--ghost)" };

  function h(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function s(tag, cls) {
    var n = document.createElementNS(NS, tag);
    if (cls) n.setAttribute("class", cls);
    return n;
  }
  function attr(n, o) { for (var k in o) n.setAttribute(k, o[k]); return n; }
  function label(d) { return d.class ? d.class + "." + d.name : d.name; }
  function cut(t, n) { return t.length > n ? t.slice(0, n - 1) + "…" : t; }
  var MEASURE = null;
  function textW(t) {
    if (!MEASURE) {
      MEASURE = document.createElement("canvas").getContext("2d");
      MEASURE.font = "12.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace";
    }
    return MEASURE.measureText(t).width;
  }
  function tickMark() {
    var v = s("svg"); attr(v, { width: 10, height: 10, viewBox: "0 0 16 16", fill: "none" });
    var p = s("path"); attr(p, { d: "M3 8.5 6.5 12 13 4.5", stroke: "var(--ground)", "stroke-width": 2.6, "stroke-linecap": "round", "stroke-linejoin": "round" });
    v.appendChild(p); return v;
  }

  if (!data) { showDrop(); return; }
  try { start(data); } catch (err) {
    var box = h("div", "hint");
    box.appendChild(h("b", null, "The page could not draw this graph."));
    box.appendChild(h("pre", null, String((err && err.stack) || err)));
    document.body.appendChild(box);
  }

  function showDrop() {
    document.body.style.overflow = "auto";
    var d = h("div"); d.id = "drop";
    d.appendChild(h("h2", null, "Drop a seam graph here"));
    var p = h("p", "hint");
    p.innerHTML = "Run <code>seam main... --json &gt; graph.json</code> and drop the file on this page, or paste the JSON.";
    d.appendChild(p);
    document.body.appendChild(d);
    document.addEventListener("dragover", function (e) { e.preventDefault(); });
    document.addEventListener("drop", function (e) {
      e.preventDefault();
      var f = e.dataTransfer && e.dataTransfer.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () { load(r.result); };
      r.readAsText(f);
    });
    document.addEventListener("paste", function (e) { load((e.clipboardData || window.clipboardData).getData("text")); });
    function load(text) {
      var g;
      try { g = JSON.parse(text); } catch (err) { d.appendChild(h("p", "hint", "That is not JSON seam wrote.")); return; }
      d.remove(); document.body.style.overflow = "hidden"; start(g);
    }
  }

  function start(g) {
    document.title = "seam · " + (g.rev || "a change");
    var defs = g.definitions || [], edges = g.edges || [], files = g.files || [], score = g.score || null;
    var byId = {}, out = {}, into = {}, members = {};
    defs.forEach(function (d) {
      byId[d.id] = d;
      if (d.class) (members[d.path + "#" + d.class] = members[d.path + "#" + d.class] || []).push(d);
    });
    edges.forEach(function (e) {
      if (!byId[e.from] || !byId[e.to] || e.from === e.to) return;
      (out[e.from] = out[e.from] || []).push(e);
      (into[e.to] = into[e.to] || []).push(e);
    });
    var tops = defs.filter(function (d) { return !d.class; });
    // The order to read in (share/order.jq). A graph from before seam had one
    // reads in the table's.
    var reading = g.reading || { threads: tops.map(function (d) { return [d.id]; }), unmet: [], loose: 0 };

    // What you have read, kept for this change in this browser alone. A viewer
    // that marks a whole file read because you read one function in it is
    // lying to you, which is why this counts definitions.
    var KEY = "seam:read:" + (g.head || g.rev || "");
    var read = {};
    try { read = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { read = {}; }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(read)); } catch (e) {} }

    var state = { sel: byId[g.at] ? g.at : null, view: "graph", q: "", hideBody: false, hideAside: false, open: {}, score: false };

    // ---------- Claude's notes ----------
    // A few words on each definition from seam --gloss, when there are any:
    // in the data already when seam had them kept, or on their way from a
    // file seam writes next to the page once Claude answers, which the page
    // asks for until it is there. Each note is a slot filled in place when
    // they land, so nothing you are reading moves or closes under you. They
    // can be turned off from the menu, and stay off in this browser.
    var gloss = g.gloss || null, glossWaiting = !gloss && !!g.glossFrom, slots = [];
    var QKEY = "seam:quips", quipsOn = true;
    try { quipsOn = localStorage.getItem(QKEY) !== "0"; } catch (e) {}
    function gl() { return quipsOn ? gloss : null; }
    function glossOf(id) { var x = gl(); return (x && x.defs && x.defs[id]) || null; }
    function whyOf(id) {
      var x = gl(), w = "";
      ((x && x.order) || []).forEach(function (o) { if (o.id === id && !w) w = o.why; });
      return w;
    }
    function nth(n) { return n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th"); }
    function edgeGloss(e) { var x = gl(); return (x && x.edges && x.edges[e.from + ">" + e.to]) || ""; }
    function quip(tag, cls, get, wait) {
      var sl = { n: h(tag, "quip " + cls), get: get, wait: wait };
      slots.push(sl);
      fillQuip(sl);
      return sl.n;
    }
    function fillQuip(sl) {
      var t = gl() ? sl.get() || "" : "";
      var waiting = !t && quipsOn && glossWaiting && !!sl.wait;
      sl.n.textContent = t || (waiting ? sl.wait : "");
      sl.n.classList.toggle("waiting", waiting);
      sl.n.hidden = !t && !waiting;
    }
    function refillQuips() {
      slots = slots.filter(function (sl) { return sl.n.isConnected; });
      slots.forEach(fillQuip);
    }
    if (glossWaiting) {
      window.seamGloss = function (x) {
        if (!glossWaiting) return;
        gloss = x; glossWaiting = false;
        refillQuips();
        // The overview is the one place a note is a list rather than a line,
        // and it has nothing open to lose.
        if (!state.sel) drawPanel();
      };
      later(g.glossFrom, function () { return glossWaiting; }, function () { window.seamGloss(null); }, 120);
    }
    // later(src, still, giveUp, tries): ask for a file seam is writing beside
    // the page, as a script, since a page opened from disk may load one but
    // not fetch one, every second and a half until it has called back.
    function later(src, still, giveUp, most) {
      var tries = 0;
      (function ask() {
        if (!still()) return;
        if (++tries > most) { giveUp(); return; }
        var sc = document.createElement("script");
        sc.src = src + "?" + tries;
        sc.onload = sc.onerror = function () { sc.remove(); if (still()) setTimeout(ask, 1500); };
        document.head.appendChild(sc);
      })();
    }

    // ---------- callers outside the change ----------
    // What a lazy provider found (seam --callers): code the change did not
    // touch that names a changed definition, and whether the change breaks it.
    // Kept or on its way the way the notes are; a compiler finding callers in
    // a monorepo can take minutes, so it is asked for for longer. Each place
    // that shows them is a slot drawn again in place when they land.
    var callers = g.callers || null, callersWaiting = !callers && !!g.callersFrom, callerSlots = [];
    var callsTo = {};
    function indexCallers() {
      callsTo = {};
      (callers || []).forEach(function (c) { (callsTo[c.to] = callsTo[c.to] || []).push(c); });
    }
    indexCallers();
    function breaksOf(id) { return (callsTo[id] || []).filter(function (c) { return c.breaks; }).length; }
    function callerSlot(draw) {
      var sl = { n: h("div", "outside"), draw: draw };
      callerSlots.push(sl);
      draw(sl.n);
      return sl.n;
    }
    function whoCalls(c) { return c.from.indexOf("#") >= 0 ? c.from.replace(/^[^#]*#/, "") : c.from.replace(/^.*\//, ""); }
    function whereCalls(c) { return c.from.replace(/#.*$/, "") + (c.line ? ":" + c.line : ""); }
    if (callersWaiting) {
      window.seamCallers = function (x) {
        if (!callersWaiting) return;
        callers = x; callersWaiting = false;
        indexCallers();
        callerSlots = callerSlots.filter(function (sl) { return sl.n.isConnected; });
        callerSlots.forEach(function (sl) { sl.n.textContent = ""; sl.draw(sl.n); });
        if (!state.sel) drawPanel();
        if (state.view === "graph") drawGraph();
      };
      later(g.callersFrom, function () { return callersWaiting; }, function () { window.seamCallers(null); }, 800);
    }

    // ---------- the card ----------
    // What a name is, without leaving where you are: hover a mention in a
    // diff, a row under Uses, or a node, and a card says what it is, how it
    // changed, what Claude says it does, and where this mention sits. A click
    // goes to it. One card at a time, and it waits a beat before it opens or
    // closes, so the pointer can cross a line of code or step onto it.
    var pop = null, popT = 0;
    function card(n, it) {
      n.addEventListener("mouseenter", function () { clearTimeout(popT); popT = setTimeout(function () { showCard(n, it); }, 160); });
      n.addEventListener("mouseleave", function () { clearTimeout(popT); popT = setTimeout(hideCard, 200); });
      n.addEventListener("focus", function () { clearTimeout(popT); showCard(n, it); });
      n.addEventListener("blur", function () { clearTimeout(popT); popT = setTimeout(hideCard, 200); });
    }
    function hideCard() { if (pop) { pop.remove(); pop = null; } }
    function showCard(n, it) {
      hideCard();
      if (!n.isConnected) return;
      var o = it.other, e = it.e;
      pop = h("div", "pop");
      pop.setAttribute("role", "tooltip");
      pop.addEventListener("mouseenter", function () { clearTimeout(popT); });
      pop.addEventListener("mouseleave", function () { popT = setTimeout(hideCard, 200); });
      var top = h("div", "pop-top");
      var g1 = h("span", "g", GLYPH[o.change] || "·");
      g1.style.color = COLOUR[o.change] || "var(--ghost)";
      top.appendChild(g1);
      top.appendChild(h("span", "nm", label(o)));
      top.appendChild(h("span", "chip " + o.change, WORD[o.change] || o.change));
      pop.appendChild(top);
      pop.appendChild(h("div", "pop-path", o.path + (o.start ? ":" + o.start : "") + (read[o.id] ? "  ·  read" : "")));
      if (o.head) {
        var sig = h("div", "pop-sig");
        paint(sig, lexLine(o.head, lexerFor(o.path), null).toks);
        pop.appendChild(sig);
      }
      var q = glossOf(o.id);
      if (q && q.does) pop.appendChild(h("p", "quip does", q.does));
      if (q && q.gloss) pop.appendChild(h("p", "quip gloss", q.gloss));
      if (!q && quipsOn && glossWaiting) pop.appendChild(h("p", "quip waiting", "Claude is reading it…"));
      if (e) {
        var user = byId[e.from];
        var where = h("p", "pop-where");
        where.appendChild(h("b", e.facet === "iface" ? "iface" : null, e.facet === "iface" ? "In the signature" : "In the body"));
        where.appendChild(document.createTextNode(" of " + (user ? label(user) : "its user") + (e.facet === "iface"
          ? ": when this changes shape, so does that." : ": a change to it stops there.") + (e.new ? " New in this change." : "")));
        pop.appendChild(where);
        var eg = edgeGloss(e);
        if (eg) pop.appendChild(h("p", "quip gloss", eg));
      }

      if (e.key === "Escape") { hideCard(); if (state.score) { state.score = false; draw(); } return; }
      if (e.key === "s" || e.key === "S") { if (score) { state.score = !state.score; draw(); } return; }
      if (e.key === "g") { state.view = state.view === "graph" ? "reading" : "graph"; fit = true; draw(); return; }
      if (e.key === " ") { e.preventDefault(); markAndAdvance(); return; }
      if (e.key === "j" || e.key === "k" || e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var order = readingOrder(), at = order.indexOf(state.sel);
        var next = (e.key === "j" || e.key === "ArrowDown")
          ? order[Math.min(order.length - 1, at + 1)]
          : order[Math.max(0, at - 1)];
        state.sel = next || order[0] || null;
        draw();
      }
    });
    window.addEventListener("resize", function () { if (state.view === "graph") { fit = true; drawGraph(); } });

    draw();
  }
})();
</script>
